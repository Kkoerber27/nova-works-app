; =========================================================================
;  NOVA WORKS - PHP-Einstellungen
;
;  Warum .user.ini und nicht .htaccess: php_value in der .htaccess wirkt
;  nur, wenn PHP als Apache-Modul läuft. Bei Strato (und den meisten
;  anderen Anbietern) läuft PHP als CGI/FastCGI - dort führt php_value in
;  der .htaccess zu einem Serverfehler 500. .user.ini ist der Weg, der in
;  beiden Fällen entweder wirkt oder folgenlos ignoriert wird.
;
;  Die Datei muss im Wurzelverzeichnis liegen, also neben index.php.
;  Änderungen greifen nicht sofort - PHP liest sie je nach Einstellung
;  erst nach einigen Minuten neu.
; =========================================================================

; Ein Foto aus einer Systemkamera hat 3 bis 10 MB, aus einer
; Spiegelreflex auch 30. Die Voreinstellung von PHP ist 2 MB - damit
; scheitert praktisch jeder echte Upload.
upload_max_filesize = 32M

; Muss größer sein als upload_max_filesize: Beim Hochladen mehrerer
; Dateien zählt die Summe, nicht die einzelne Datei.
post_max_size = 160M
max_file_uploads = 20

; GD hält ein Bild unkomprimiert im Speicher: Breite x Höhe x 4 Byte.
; Ein Foto mit 8640 x 5760 Pixeln sind allein 199 MB, dazu kommt beim
; Verkleinern eine Zwischenfassung. Reicht der Speicher nicht, bricht
; PHP ohne Meldung ab - deshalb prüft admin/kern/bild.php zusätzlich
; vorher, ob es passt, und sagt es verständlich.
memory_limit = 512M

; Fünf Breiten aus einem 30-MB-Foto dauern auf einem geteilten Server
; auch mal eine Minute.
max_execution_time = 180
