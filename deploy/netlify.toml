# =========================================================================
#  Netlify-Variante der Homepage
#
#  Diese Datei gehoert NICHT hierher, sondern ins Wurzelverzeichnis des
#  Repositories - dort liegt aber bereits die netlify.toml der internen
#  App. Beides in einem Netlify-Projekt geht nicht.
#
#  Wenn die Homepage ueber Netlify laufen soll:
#    1. Ein zweites Netlify-Projekt auf dasselbe Repository zeigen lassen.
#    2. Dort unter "Build & deploy" das Publish-Verzeichnis auf  site  setzen.
#    3. Den Inhalt dieser Datei als netlify.toml verwenden.
#
#  Achtung: Netlify fuehrt kein PHP aus. kontakt.php laeuft dort nicht.
#  Siehe docs/hosting.md, Abschnitt "Formular ohne PHP".
# =========================================================================

[build]
  publish = "site"

[[redirects]]
  from = "/impressum/"
  to = "/impressum.html"
  status = 301

[[redirects]]
  from = "/datenschutzerklaerung/"
  to = "/datenschutz.html"
  status = 301

[[redirects]]
  from = "/2026/02/06/hallo-welt/"
  to = "/"
  status = 301

# Reste der alten WordPress-Installation
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 410

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
