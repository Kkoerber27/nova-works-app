<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schichtplan – NOVA WORKS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --aufbau:#c0713a; --proben:#4a7fb5; --show:#5a9e6f; --abbau:#8a8a8a;
    --dark:#1a1a1a; --border:#ddd; --bg:#f4f3f1; --ink:#1a1a1a; --ink2:#555;
    --shadow:0 2px 12px rgba(0,0,0,.1); --white:#ffffff;
  }
  html,body{min-height:100%;font-family:"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;}
  body{display:flex;flex-direction:column;}

  /* Topbar */
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow);}
  .topbar img{height:34px;}
  .topbar-title{font-size:14px;font-weight:300;letter-spacing:2px;text-transform:uppercase;flex:1;color:var(--ink);}
  .topbar-sub{font-size:11px;color:#999;margin-left:4px;}
  .btn{padding:7px 14px;border:none;border-radius:3px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.4px;transition:opacity .15s;}
  .btn:hover{opacity:.85;}
  .btn-save{background:#2d7a4f;color:#fff;}
  .btn-excel{background:#1d6f42;color:#fff;}
  .btn-pdf{background:#c0392b;color:#fff;}
  .btn-back{background:none;border:1px solid #ccc;color:var(--ink2);}
  .save-ind{font-size:11px;color:#aaa;transition:color .3s;}
  .no-print{}

  /* Legend */
  .legend{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);}
  .legend-dot{width:12px;height:12px;border-radius:2px;}

  /* Main */
  .main{flex:1;padding:24px 28px;max-width:1100px;margin:0 auto;width:100%;}

  /* Day block */
  .day-block{margin-bottom:16px;border-radius:5px;overflow:hidden;box-shadow:var(--shadow);background:#fff;}
  .day-header{display:flex;align-items:center;gap:10px;padding:8px 14px;color:#fff;font-weight:600;font-size:13px;cursor:pointer;user-select:none;}
  .day-header.aufbau{background:var(--aufbau);}
  .day-header.proben{background:var(--proben);}
  .day-header.show  {background:var(--show);}
  .day-header.abbau {background:var(--abbau);}
  .day-header.extra {background:#6a6a6a;}
  .day-chevron{font-size:10px;opacity:.8;transition:transform .2s;}
  .day-block.collapsed .day-chevron{transform:rotate(-90deg);}
  .day-block.collapsed .day-body{display:none;}
  .day-name{flex:1;font-size:14px;}
  .day-badge{background:rgba(255,255,255,.25);border-radius:2px;padding:2px 7px;font-size:10px;letter-spacing:1px;text-transform:uppercase;}
  .btn-add-row{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:3px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn-add-row:hover{background:rgba(255,255,255,.35);}
  .btn-add-day{background:none;border:2px dashed #ccc;color:#aaa;border-radius:5px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;width:100%;letter-spacing:1px;transition:all .15s;margin:4px 0;}
  .btn-add-day:hover{border-color:#888;color:#555;background:#fafafa;}

  /* Shift table */
  .day-body{}
  .sh-header{display:grid;grid-template-columns:36px 120px 1fr 90px 90px 1fr 32px;background:#f7f6f4;border-bottom:1px solid var(--border);}
  .sh-header span{padding:5px 8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#999;border-right:1px solid var(--border);}
  .sh-header span:last-child{border-right:none;}
  .sh-row{display:grid;grid-template-columns:36px 120px 1fr 90px 90px 1fr 32px;border-bottom:1px solid #f0eeed;}
  .sh-row:last-child{border-bottom:none;}
  .sh-row:hover{background:#fafaf9;}
  .sh-cell{border-right:1px solid #f0eeed;display:flex;align-items:center;}
  .sh-cell:last-child{border-right:none;justify-content:center;}
  .sh-cell input[type="time"],.sh-cell input[type="text"]{
    width:100%;border:none;background:transparent;font-size:12px;font-family:inherit;
    color:var(--ink);padding:7px 8px;outline:none;
  }
  .sh-cell input:focus{background:#eef4ff;}
  .gw-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
  .gw-chip{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:2px 7px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
  .sh-name{font-weight:600;font-size:12px;padding:0 8px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .del-btn{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:4px 8px;line-height:1;}
  .del-btn:hover{color:#e55;}
  .day-empty{padding:10px 14px;font-size:12px;color:#bbb;font-style:italic;}

  /* Gewerk-Gruppe Subheader */
  .gw-group-header{background:#f0eeed;padding:4px 14px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#888;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);}

  /* Date-range fallback */
  .date-setup {
    background:#fff; border:1px solid var(--border); border-radius:5px;
    padding:24px 28px; margin-bottom:20px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .date-setup h3 { font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#888; flex-basis:100%; margin-bottom:4px; }
  .date-setup label { font-size:12px; color:#555; display:flex; align-items:center; gap:8px; }
  .date-setup input[type="date"] { border:1px solid #ddd; border-radius:3px; padding:6px 10px; font-size:13px; font-family:inherit; color:var(--ink); }
  .date-setup .btn-gen { background:#e07b3a; color:#fff; padding:8px 20px; border:none; border-radius:3px; font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.5px; }
  .date-setup .btn-gen:hover { opacity:.85; }

  /* Print */
  @media print{
    .no-print,.btn-add-row,.btn-add-day,.del-btn{display:none!important;}
    .main{padding:0;max-width:100%;}
    body{background:#fff;}
    .day-block{break-inside:avoid;box-shadow:none;border:1px solid #ddd;}
    .day-header{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .day-block.collapsed .day-body{display:block!important;}
  }
</style>
</head>

<script>
// ── Supabase ──
const SUPABASE_URL = 'https://ekfuzciwjsldpkojyzgg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_53YU2qO5PwdFwhVuZSSyPg_pcdw2Dhk';
let _supaClient = null;
function getSupaClient() {
  if (!_supaClient) { const { createClient } = window.supabase; _supaClient = createClient(SUPABASE_URL, SUPABASE_KEY); }
  return _supaClient;
}
const SupaDB = {
  cache: {},
  async init(keys) {
    try { const { data, error } = await getSupaClient().from('app_data').select('key,value').in('key', keys); if (error) throw error; if (data) data.forEach(row => { this.cache[row.key] = row.value; }); } catch(e) { console.warn('Supabase init:', e); }
  },
  get(key, fallback) { return (this.cache[key] !== undefined) ? this.cache[key] : (fallback !== undefined ? fallback : null); },
  async set(key, value) {
    this.cache[key] = value;
    try { const { error } = await getSupaClient().from('app_data').upsert({ key, value, updated_at: new Date().toISOString() }); if (error) throw error; } catch(e) { console.warn('Supabase set:', e); }
  }
};

// ── Constants ──
const PHASE_COLORS = { aufbau:'#c0713a', proben:'#4a7fb5', show:'#5a9e6f', abbau:'#8a8a8a', extra:'#6a6a6a' };
const PHASE_LABELS = { aufbau:'Aufbau', proben:'Proben', show:'Show', abbau:'Abbau', extra:'Extra' };
const GEWERKE = [
  {id:'tl',      name:'Techn. Leitung', color:'#8a8a8a'},
  {id:'licht',   name:'Licht',          color:'#4a7fb5'},
  {id:'ton',     name:'Ton',            color:'#5a9e6f'},
  {id:'rigging', name:'Rigging',        color:'#c0713a'},
  {id:'av',      name:'AV / Video',     color:'#7c5cbf'},
];

// ── State ──
let eventName = '';
let phases = {};
let days = [];     // [{date, phase, rows:[{gid,name,von,bis,notiz}]}]
let rowCounter = 0;

function getSaveKey() { return 'nw_schichtplan_' + (eventName || '_default'); }

// ── Date helpers ──
function phS(s) { return s ? s.split('/')[0].trim() : ''; }
function phE(s) { return s && s.includes('/') ? s.split('/')[1].trim() : ''; }
function isoDate(s) { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; }
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function fmtDateDE(iso) { if (!iso) return ''; const [y,m,d] = iso.split('-'); return d+'.'+m+'.'+y; }
function dayOfWeekDE(iso) { return ['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(iso+'T00:00:00').getDay()]; }

function getPhaseForDate(iso) {
  const phases_order = ['aufbau','proben','show','abbau'];
  for (const ph of phases_order) {
    if (!phases[ph]) continue;
    const s = phS(phases[ph]), e = phE(phases[ph]) || s;
    if (s && e && iso >= s && iso <= e) return ph;
  }
  return 'extra';
}

function buildDayRange() {
  const starts = [], ends = [];
  for (const ph of ['aufbau','proben','show','abbau']) {
    const s = phS(phases[ph]), e = phE(phases[ph]) || s;
    if (s) starts.push(s);
    if (e) ends.push(e);
  }
  if (!starts.length) return [];
  starts.sort(); ends.sort();
  const from = starts[0], to = ends[ends.length-1];
  const result = [];
  let cur = from;
  while (cur <= to) {
    result.push(cur);
    cur = addDays(cur, 1);
  }
  return result;
}

// ── Crew from planungen ──
let crewByGewerk = {};  // {gid: [{name, funktion}]}

async function loadCrewFromPlanung() {
  await SupaDB.init(['nw_crew_planungen']);
  const planungen = SupaDB.get('nw_crew_planungen', []);
  const match = planungen.find(p => p.name === eventName);
  if (!match || !match.crew) return;
  crewByGewerk = {};
  GEWERKE.forEach(g => {
    const arr = (match.crew[g.id] || []).filter(m => m.name && m.name.trim());
    if (arr.length) crewByGewerk[g.id] = arr;
  });
  // Also update phases if not set from URL
  if (!phases.aufbau && match.aufbau) phases.aufbau = match.aufbau;
  if (!phases.proben && match.proben) phases.proben = match.proben;
  if (!phases.show   && match.show)   phases.show   = match.show;
  if (!phases.abbau  && match.abbau)  phases.abbau  = match.abbau;
}

function buildDefaultRowsForDay(date) {
  const rows = [];
  GEWERKE.forEach(g => {
    const members = crewByGewerk[g.id] || [];
    members.forEach(m => {
      rows.push({ gid: g.id, name: m.name, von: '', bis: '', notiz: '' });
    });
  });
  return rows;
}

// ── Render ──
function renderAll() {
  const container = document.getElementById('planContainer');
  container.innerHTML = days.map((day, di) => renderDay(day, di)).join('');
  // Show date-range setup if no days loaded
  const setup = document.getElementById('dateSetup');
  if (setup) setup.style.display = days.length ? 'none' : 'flex';
}

function renderDay(day, di) {
  const ph = day.phase || 'extra';
  const color = PHASE_COLORS[ph] || '#6a6a6a';
  const label = PHASE_LABELS[ph] || 'Extra';
  const collapsed = day.collapsed ? 'collapsed' : '';
  const rowsHtml = day.rows.length
    ? renderRowsGrouped(day.rows, di)
    : '<div class="day-empty">Keine Einträge – klicke "+ Zeile" um Personen hinzuzufügen.</div>';

  return `<div class="day-block ${collapsed}" id="dayblock_${di}">
    <div class="day-header ${ph}" onclick="toggleDay(${di})">
      <span class="day-chevron">▼</span>
      <span class="day-name">${dayOfWeekDE(day.date)}, ${fmtDateDE(day.date)}</span>
      <span class="day-badge">${label}</span>
      <button class="btn-add-row no-print" onclick="event.stopPropagation();addShiftRow(${di})">+ Zeile</button>
    </div>
    <div class="day-body">
      <div class="sh-header">
        <span></span>
        <span>Gewerk</span>
        <span>Name</span>
        <span>Von</span>
        <span>Bis</span>
        <span>Notiz</span>
        <span></span>
      </div>
      ${rowsHtml}
    </div>
  </div>`;
}

function renderRowsGrouped(rows, di) {
  // Group by gewerk for display, but render flat with group subheaders
  let lastGid = null;
  return rows.map((row, ri) => {
    let groupHdr = '';
    if (row.gid !== lastGid) {
      const g = GEWERKE.find(x => x.id === row.gid);
      const gname = g ? g.name : (row.gid || '–');
      const gcol  = g ? g.color : '#888';
      groupHdr = `<div class="gw-group-header"><div class="gw-dot" style="background:${gcol}"></div>${gname}</div>`;
      lastGid = row.gid;
    }
    return groupHdr + renderShiftRow(row, di, ri);
  }).join('');
}

function renderShiftRow(row, di, ri) {
  const g = GEWERKE.find(x => x.id === row.gid);
  const gcol = g ? g.color : '#888';
  return `<div class="sh-row" id="shrow_${di}_${ri}">
    <div class="sh-cell" style="justify-content:center;padding:0 4px"><div class="gw-dot" style="background:${gcol}"></div></div>
    <div class="sh-cell" style="padding:0"><select style="width:100%;border:none;background:transparent;font-size:11px;padding:7px 6px;outline:none;cursor:pointer;font-family:inherit;color:#333" onchange="updateShiftField(${di},${ri},'gid',this.value)">
      ${GEWERKE.map(x => `<option value="${x.id}" ${x.id===row.gid?'selected':''}>${x.name}</option>`).join('')}
    </select></div>
    <div class="sh-cell"><input type="text" value="${esc(row.name)}" placeholder="Name" style="font-weight:600" oninput="updateShiftField(${di},${ri},'name',this.value)"></div>
    <div class="sh-cell"><input type="time" value="${row.von||''}" oninput="updateShiftField(${di},${ri},'von',this.value)"></div>
    <div class="sh-cell"><input type="time" value="${row.bis||''}" oninput="updateShiftField(${di},${ri},'bis',this.value)"></div>
    <div class="sh-cell"><input type="text" value="${esc(row.notiz||'')}" placeholder="–" oninput="updateShiftField(${di},${ri},'notiz',this.value)"></div>
    <div class="sh-cell"><button class="del-btn" onclick="delShiftRow(${di},${ri})" title="Zeile löschen">×</button></div>
  </div>`;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Interactions ──
function toggleDay(di) {
  days[di].collapsed = !days[di].collapsed;
  const block = document.getElementById('dayblock_' + di);
  if (block) block.className = 'day-block' + (days[di].collapsed ? ' collapsed' : '');
}

function updateShiftField(di, ri, field, val) {
  if (!days[di] || !days[di].rows[ri]) return;
  days[di].rows[ri][field] = val;
  if (field === 'gid') {
    // Re-render day body to update group headers and dot colors
    rerenderDayBody(di);
  }
  saveState(false);
}

function rerenderDayBody(di) {
  const block = document.getElementById('dayblock_' + di);
  if (!block) return;
  const body = block.querySelector('.day-body');
  if (!body) return;
  const rows = days[di].rows;
  const rowsHtml = rows.length
    ? renderRowsGrouped(rows, di)
    : '<div class="day-empty">Keine Einträge.</div>';
  body.innerHTML = `<div class="sh-header">
    <span></span><span>Gewerk</span><span>Name</span>
    <span>Von</span><span>Bis</span><span>Notiz</span><span></span>
  </div>` + rowsHtml;
}

function addShiftRow(di) {
  days[di].rows.push({ gid: 'licht', name: '', von: '', bis: '', notiz: '' });
  rerenderDayBody(di);
  saveState(false);
  // Focus name field of new row
  setTimeout(() => {
    const block = document.getElementById('dayblock_' + di);
    if (!block) return;
    const rows = block.querySelectorAll('.sh-row');
    if (rows.length) {
      const inp = rows[rows.length-1].querySelector('input[type="text"]');
      if (inp) inp.focus();
    }
  }, 50);
}

function delShiftRow(di, ri) {
  days[di].rows.splice(ri, 1);
  rerenderDayBody(di);
  saveState(false);
}

function addExtraDay() {
  // Find last day and add next day
  const lastDate = days.length ? days[days.length-1].date : new Date().toISOString().slice(0,10);
  const newDate = addDays(lastDate, 1);
  days.push({ date: newDate, phase: getPhaseForDate(newDate), rows: [], collapsed: false });
  renderAll();
  saveState(false);
  // Scroll to new block
  setTimeout(() => {
    const b = document.getElementById('dayblock_' + (days.length-1));
    if (b) b.scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

// ── Save / Load ──
function saveState(manual) {
  SupaDB.set(getSaveKey(), { eventName, phases, days, savedAt: new Date().toISOString() });
  const ind = document.getElementById('saveInd');
  if (ind) {
    ind.textContent = manual ? '✓ Gespeichert' : '● gespeichert';
    ind.style.color = manual ? '#2d7a4f' : '#aaa';
    if (manual) setTimeout(() => { ind.textContent = ''; }, 2500);
  }
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const mL = 12, mT = 12, mR = 12;
  const cW = pageW - mL - mR;

  function drawHeader(y) {
    // Logo area
    try { pdf.addImage(NW_LOGO_LIGHT, 'PNG', mL, y, 38, 10); } catch(e) {}
    // Title right-aligned
    pdf.setFont('helvetica','bold'); pdf.setFontSize(14); pdf.setTextColor(30,30,30);
    pdf.text('Schichtplan', pageW - mR, y + 7, { align: 'right' });
    // Event name
    if (eventName) {
      pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(120,120,120);
      pdf.text(eventName, pageW - mR, y + 12, { align: 'right' });
    }
    y += 16;
    // Separator
    pdf.setDrawColor(200,200,200); pdf.setLineWidth(0.3); pdf.line(mL, y, pageW - mR, y);
    y += 4;
    return y;
  }

  let y = mT;
  y = drawHeader(y);

  const rowH = 7;
  const colW = [28, 35, 85, 26, 26, 97]; // Gewerk, Name-label (unused in data), Name, Von, Bis, Notiz

  days.forEach(day => {
    if (!day.rows.length) return;
    // Day header bar
    const ph = day.phase || 'extra';
    const col = PHASE_COLORS[ph] || '#6a6a6a';
    const rgb = hexToRgb(col);

    // Check page break for day header + at least one row
    if (y + rowH * 2 + 8 > pageH - mT) { pdf.addPage(); y = mT; y = drawHeader(y); }

    // Day header
    pdf.setFillColor(rgb.r, rgb.g, rgb.b);
    pdf.rect(mL, y, cW, 8, 'F');
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(255,255,255);
    pdf.text(dayOfWeekDE(day.date) + ', ' + fmtDateDE(day.date), mL + 4, y + 5.5);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
    pdf.text(PHASE_LABELS[ph] || '', pageW - mR - 2, y + 5.5, { align: 'right' });
    y += 8;

    // Column headers
    pdf.setFillColor(45,45,45);
    pdf.rect(mL, y, cW, 6, 'F');
    pdf.setFont('helvetica','bold'); pdf.setFontSize(7); pdf.setTextColor(180,180,180);
    const headers = ['Gewerk','Name','Von','Bis','Notiz'];
    const hCols = [28, 80, 26, 26, 0];
    let hx = mL + 2;
    headers.forEach((h, i) => { pdf.text(h, hx, y + 4); hx += hCols[i] || (cW - 28 - 80 - 26 - 26); });
    y += 6;

    // Group by gewerk
    let lastGid = null;
    day.rows.forEach(row => {
      if (y + rowH > pageH - mT) { pdf.addPage(); y = mT; y = drawHeader(y); }

      // Zebra
      pdf.setFillColor(row === day.rows.find((_,i) => i % 2 === 0) ? 252 : 247, 246, 244);
      pdf.rect(mL, y, cW, rowH, 'F');

      const g = GEWERKE.find(x => x.id === row.gid);
      const gcol = g ? g.color : '#888';
      const grgb = hexToRgb(gcol);
      const gname = g ? g.name : (row.gid || '–');

      // Gewerk chip
      pdf.setFillColor(grgb.r, grgb.g, grgb.b);
      pdf.roundedRect(mL + 1, y + 1.5, 24, 4, 1, 1, 'F');
      pdf.setFont('helvetica','bold'); pdf.setFontSize(6.5); pdf.setTextColor(255,255,255);
      pdf.text(gname.substring(0,10), mL + 3, y + 4.5);

      pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(30,30,30);
      // Name
      const nameX = mL + 29;
      pdf.text(truncate(row.name || '–', 38), nameX, y + 5);
      // Von
      pdf.setTextColor(0, 100, 180);
      pdf.text(row.von || '–', nameX + 81, y + 5);
      // Bis
      pdf.text(row.bis || '–', nameX + 107, y + 5);
      // Notiz
      pdf.setTextColor(100, 100, 100); pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5);
      pdf.text(truncate(row.notiz || '', 45), nameX + 133, y + 5);

      y += rowH;
    });
    y += 4; // gap between days
  });

  const safe = (eventName || 'Schichtplan').replace(/[^a-zA-Z0-9äöüÄÖÜß\-_ ]/g,'').trim();
  pdf.save('NW_Schichtplan_' + safe + '.pdf');
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function truncate(s, n) { return s.length > n ? s.slice(0,n-1)+'…' : s; }

// ── Manual date range ──
function generateFromRange() {
  const from = document.getElementById('rangeFrom').value;
  const to   = document.getElementById('rangeTo').value;
  if (!from || !to || from > to) { alert('Bitte gültigen Zeitraum eingeben.'); return; }
  days = [];
  let cur = from;
  while (cur <= to) {
    days.push({ date: cur, phase: getPhaseForDate(cur), rows: buildDefaultRowsForDay(cur), collapsed: false });
    cur = addDays(cur, 1);
  }
  renderAll();
  saveState(false);
}

// ── Init ──
async function init() {
  const params = new URLSearchParams(window.location.search);
  eventName = params.get('e') || '';
  if (params.get('aufbau')) phases.aufbau = params.get('aufbau');
  if (params.get('proben')) phases.proben = params.get('proben');
  if (params.get('show'))   phases.show   = params.get('show');
  if (params.get('abbau'))  phases.abbau  = params.get('abbau');

  document.getElementById('eventLabel').textContent = eventName ? ' – ' + eventName : '';
  document.title = 'Schichtplan' + (eventName ? ' – ' + eventName : '') + ' | NOVA WORKS';

  // Load crew + phases from planungen
  await loadCrewFromPlanung();

  // Pre-fill date range picker from phases
  const rangeFrom = phS(phases.aufbau || phases.proben || phases.show || phases.abbau || '');
  const rangeTo   = phE(phases.abbau  || phases.show   || phases.proben || phases.aufbau || '') || rangeFrom;
  if (rangeFrom) {
    const f = document.getElementById('rangeFrom'); if (f) f.value = rangeFrom;
  }
  if (rangeTo) {
    const t = document.getElementById('rangeTo'); if (t) t.value = rangeTo;
  }

  // Load saved state
  await SupaDB.init([getSaveKey()]);
  const saved = SupaDB.get(getSaveKey());
  if (saved && saved.days && saved.days.length) {
    days = saved.days;
    if (saved.phases) Object.assign(phases, saved.phases);
  } else {
    // Build from date range + crew
    const dateRange = buildDayRange();
    if (dateRange.length) {
      days = dateRange.map(date => ({
        date,
        phase: getPhaseForDate(date),
        rows: buildDefaultRowsForDay(date),
        collapsed: false
      }));
    }
  }
  renderAll();
}

init();
