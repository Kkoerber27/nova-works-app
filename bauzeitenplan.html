<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauzeitenplan – NOVA WORKS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --aufbau:#c0713a; --proben:#4a7fb5; --show:#5a9e6f; --abbau:#8a8a8a;
    --dark:#1a1a1a; --border:#ddd; --bg:#f4f3f1; --ink:#1a1a1a; --ink2:#555;
    --shadow:0 2px 12px rgba(0,0,0,.1);
  }
  html,body{min-height:100%;font-family:"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;}
  body{display:flex;flex-direction:column;}

  /* ── Topbar ── */
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow);}
  .topbar img{height:34px;}
  .topbar-title{font-size:14px;font-weight:300;letter-spacing:2px;text-transform:uppercase;flex:1;color:var(--ink);}
  .topbar-sub{font-size:11px;color:#999;margin-left:4px;}
  .btn{padding:7px 14px;border:none;border-radius:3px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.4px;transition:opacity .15s;}
  .btn:hover{opacity:.85;}
  .btn-save{background:#2d7a4f;color:#fff;}
  .btn-excel{background:#1d6f42;color:#fff;}
  .btn-pdf{background:#c0392b;color:#fff;}
  .btn-back{background:none;border:1px solid #ccc;color:var(--ink2);}
  .save-ind{font-size:11px;color:#aaa;transition:color .3s;}
  .no-print{}

  /* ── Main ── */
  .main{flex:1;padding:24px 28px;max-width:1100px;margin:0 auto;width:100%;}

  /* ── Phase legend ── */
  .legend{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);}
  .legend-dot{width:12px;height:12px;border-radius:2px;}

  /* ── Day block ── */
  .day-block{margin-bottom:16px;border-radius:5px;overflow:hidden;box-shadow:var(--shadow);background:#fff;}
  .day-header{display:flex;align-items:center;gap:10px;padding:8px 14px;color:#fff;font-weight:600;font-size:13px;}
  .day-header.aufbau{background:var(--aufbau);}
  .day-header.proben{background:var(--proben);}
  .day-header.show{background:var(--show);}
  .day-header.abbau{background:var(--abbau);}
  /* .multi wird jetzt inline per JS gesetzt, abhängig von den tatsächlichen Phasen */
  .day-header.extra{background:#6a6a6a;}
  .btn-add-day{background:none;border:2px dashed #ccc;color:#aaa;border-radius:5px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;width:100%;letter-spacing:1px;transition:all .15s;margin:4px 0;}
  .btn-add-day:hover{border-color:#888;color:#555;background:#fafafa;}
  @media print{.btn-add-day{display:none!important;}}
  .day-name{flex:1;font-size:14px;}
  .day-badge{background:rgba(255,255,255,.25);border-radius:2px;padding:2px 7px;font-size:10px;letter-spacing:1px;text-transform:uppercase;}
  .day-tag-num{font-size:10px;opacity:.8;}
  .btn-add-row{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:3px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn-add-row:hover{background:rgba(255,255,255,.35);}

  /* ── Row table ── */
  .day-rows{border-top:none;}
  .bz-row-header{display:grid;grid-template-columns:90px 90px 1fr 160px 160px 32px;gap:0;background:#f7f6f4;border-bottom:1px solid var(--border);}
  .bz-row-header span{padding:5px 8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#999;border-right:1px solid var(--border);}
  .bz-row-header span:last-child{border-right:none;}

  .bz-row{display:grid;grid-template-columns:90px 90px 1fr 160px 160px 32px;gap:0;border-bottom:1px solid #f0eeed;}
  .bz-row:last-child{border-bottom:none;}
  .bz-row:hover{background:#fafaf9;}
  .bz-cell{border-right:1px solid #f0eeed;display:flex;align-items:center;}
  .bz-cell:last-child{border-right:none;justify-content:center;}
  .bz-cell input[type="time"],.bz-cell input[type="text"],.bz-cell select{
    width:100%;border:none;background:transparent;font-size:12px;font-family:inherit;
    color:var(--ink);padding:7px 8px;outline:none;
  }
  .bz-cell input:focus,.bz-cell select:focus{background:#eef4ff;}
  .bz-cell select{cursor:pointer;}
  .del-btn{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:4px 8px;line-height:1;}
  .del-btn:hover{color:#e55;}

  .day-empty{padding:10px 14px;font-size:12px;color:#bbb;font-style:italic;}


  /* ── Multi-Gewerk Chip Selector ── */
  .gw-cell { position: relative; min-width: 0; }
  .gw-chips {
    display: flex; flex-wrap: wrap; gap: 3px; padding: 4px 6px;
    cursor: pointer; min-height: 32px; align-items: center;
  }
  .gw-chips:hover { background: #eef4ff; }
  .gw-chip {
    display: inline-flex; align-items: center; gap: 3px;
    border-radius: 3px; padding: 2px 6px; font-size: 10px;
    font-weight: 700; color: #fff; white-space: nowrap; letter-spacing: .3px;
  }
  .gw-placeholder { font-size: 11px; color: #bbb; font-style: italic; }
  .gw-panel {
    position: fixed; z-index: 9999;
    background: #fff; border: 1px solid #ddd; border-radius: 5px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15); padding: 8px;
    display: none; min-width: 300px; max-width: 400px;
  }
  .gw-panel.open { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .gw-option {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    border-radius: 3px; cursor: pointer; font-size: 12px;
    border: 1px solid #eee; user-select: none; transition: opacity .12s;
  }
  .gw-option:hover { opacity: .85; }
  .gw-option.selected { border-color: transparent; color: #fff; }
  .gw-option .gw-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* ── Print ── */
  @media print{
    .no-print,.btn-add-row,.del-btn{display:none!important;}
    .main{padding:0;max-width:100%;}
    body{background:#fff;}
    .day-block{break-inside:avoid;box-shadow:none;border:1px solid #ddd;}
    .day-header{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>

<script>

// ── Supabase Helper ──
const SUPABASE_URL = 'https://ekfuzciwjsldpkojyzgg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_53YU2qO5PwdFwhVuZSSyPg_pcdw2Dhk';
const SupaDB = {
  cache: {},
  async init(keys) {
    try {
      const r = await fetch(SUPABASE_URL+'/rest/v1/app_data?key=in.('+keys.map(k=>'"'+k+'"').join(',')+')', {

      const rows = await r.json();
      if (Array.isArray(rows)) rows.forEach(row => { this.cache[row.key] = row.value; });
    } catch(e) { console.warn('Supabase init fehler:',e); }
  },
  get(key, fallback) { return (this.cache[key] !== undefined) ? this.cache[key] : (fallback !== undefined ? fallback : null); },
  async set(key, value) {
    this.cache[key] = value;
    try {
      await fetch(SUPABASE_URL+'/rest/v1/app_data', {
        method:'POST',
        headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},

      });

};

const GEWERKE_LIST = [
  {id:'licht',      label:'Licht',       color:'#4a7fb5'},
  {id:'ton',        label:'Ton',         color:'#5a9e6f'},

  {id:'led',        label:'LED',         color:'#e91e8c'},

  {id:'strom',      label:'Strom',       color:'#f5a623'},

  {id:'buehne',     label:'Bühne',       color:'#795548'},
  {id:'sfx',        label:'SFX',         color:'#e53935'},
  {id:'laser',      label:'Laser',       color:'#00bcd4'},
  {id:'pyro',       label:'Pyro',        color:'#ff6f00'},
  {id:'decor',      label:'Décor',       color:'#66bb6a'},
  {id:'catering',   label:'Catering',    color:'#26a69a'},

const PHASE_COLORS = {aufbau:'aufbau',proben:'proben',show:'show',abbau:'abbau'};
const WEEKDAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS   = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

let eventName = '';
let phases    = {};
let dayData   = {}; // { 'YYYY-MM-DD': [{von,bis,desc,gewerk,maschinen}, ...] }
let rowCounts = {}; // per day
let extraDays = []; // manually added days outside phase range

// ── Date helpers ──
function isoToDate(s){ return s ? new Date(s+'T00:00:00') : null; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){
  const d=isoToDate(iso);
  return WEEKDAYS[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}

function phaseStart(key){ return phases[key] ? phases[key].split('/')[0] : ''; }
function phaseEnd(key){
  if (!phases[key]) return '';
  const p=phases[key];
  return p.includes('/') ? p.split('/')[1] : p.split('/')[0];
}

// ── Determine phase(s) for a date ──
function getPhaseForDay(iso){
  const result = [];
  ['aufbau','proben','show','abbau'].forEach(function(k){
    const s=phaseStart(k), e=phaseEnd(k);
    if (s && iso >= s && iso <= e) result.push(k);
  });
  return result;
}

// ── Build ordered list of all days ──
function getAllDays(){
  const starts=[], ends=[];
  ['aufbau','proben','show','abbau'].forEach(function(k){
    const s=phaseStart(k),e=phaseEnd(k);
    if(s) starts.push(s);
    if(e) ends.push(e);
  });
  if(!starts.length && !extraDays.length) return [];
  const days=[];
  if (starts.length) {
    starts.sort(); ends.sort();
    let cur=isoToDate(starts[0]);
    const stop=isoToDate(ends[ends.length-1]);
    while(cur<=stop){ days.push(toISO(cur)); cur=addDays(cur,1); }
  }
  // Merge manually added days
  extraDays.forEach(function(d){ if(!days.includes(d)) days.push(d); });
  days.sort();
  return days;
}

// ── Add a day before the current first day ──
function addDayBefore(){
  const all = getAllDays();
  const first = all.length ? all[0] : toISO(new Date());
  const newDay = toISO(addDays(isoToDate(first), -1));
  if (!extraDays.includes(newDay)) {
    extraDays.push(newDay);
    renderAll();
    scheduleAutoSave();
  }
}

// ── Add a day after the current last day ──
function addDayAfter(){
  const all = getAllDays();
  const last = all.length ? all[all.length-1] : toISO(new Date());
  const newDay = toISO(addDays(isoToDate(last), 1));
  if (!extraDays.includes(newDay)) {
    extraDays.push(newDay);
    renderAll();
    scheduleAutoSave();
  }
}

// ── Remove an extra day ──
function removeExtraDay(iso){
  extraDays = extraDays.filter(function(d){ return d !== iso; });
  renderAll();
  scheduleAutoSave();
}

// ── Render all day blocks ──
function renderAll(){
  const container = document.getElementById('planContainer');
  container.innerHTML = '';
  const days = getAllDays();
  if(!days.length){
    container.innerHTML = '<div style="color:#aaa;padding:20px">Keine Phasendaten vorhanden.</div>';
    return;
  }

  // + Tag davor Button
  const btnBefore = document.createElement('button');
  btnBefore.className = 'btn-add-day no-print';
  btnBefore.textContent = '+ Tag davor einfügen';
  btnBefore.onclick = addDayBefore;
  container.appendChild(btnBefore);

  // Phase tag counters
  const tagCount = {aufbau:0,proben:0,show:0,abbau:0};
  days.forEach(function(iso){
    const ph = getPhaseForDay(iso);
    ph.forEach(function(k){ tagCount[k]++; });
    renderDayBlock(container, iso, ph);
  });

  // + Tag danach Button
  const btnAfter = document.createElement('button');
  btnAfter.className = 'btn-add-day no-print';
  btnAfter.textContent = '+ Tag danach einfügen';
  btnAfter.onclick = addDayAfter;
  container.appendChild(btnAfter);
}

function renderDayBlock(container, iso, phases_for_day){
  const block = document.createElement('div');
  block.className = 'day-block';
  block.id = 'day-'+iso;

  const isExtra = phases_for_day.length === 0;
  const ph0 = phases_for_day[0] || 'extra';
  const phaseLabel = isExtra ? 'Zusatztag'
    : phases_for_day.map(function(k){ return k.charAt(0).toUpperCase()+k.slice(1); }).join(' + ');

  // Dynamischer Gradient basierend auf den tatsächlichen Phasen des Tages
  const PHASE_HEX = { aufbau:'#c0713a', proben:'#4a7fb5', show:'#5a9e6f', abbau:'#8a8a8a', extra:'#6a6a6a' };
  let headerBg;
  if (phases_for_day.length > 1) {
    const pct = 100 / phases_for_day.length;
    const stops = phases_for_day.map(function(k, i){
      const c = PHASE_HEX[k] || '#888';
      return c+' '+(i*pct)+'%,'+c+' '+((i+1)*pct)+'%';
    }).join(',');
    headerBg = 'linear-gradient(90deg,'+stops+')';
  } else {
    headerBg = PHASE_HEX[ph0] || '#888';
  }

  const delBtn = isExtra
    ? '<button class="btn-add-row no-print" style="background:rgba(255,255,255,.15);margin-left:6px" onclick="removeExtraDay(\''+iso+'\')" title="Diesen Tag entfernen">✕ Entfernen</button>'
    : '';

  block.innerHTML =
    '<div class="day-header" style="background:'+headerBg+'">' +
      '<span class="day-name">'+fmtDate(iso)+'</span>' +
      '<span class="day-badge">'+phaseLabel+'</span>' +
      '<button class="btn-add-row" onclick="addRow(\''+iso+'\')">+ Zeile</button>' +
      delBtn +
    '</div>' +
    '<div class="bz-row-header">' +
      '<span>Von</span><span>Bis</span><span>Beschreibung / Tätigkeit</span><span>Gewerk</span><span>Arbeitsmaschinen</span><span></span>' +
    '</div>' +
    '<div class="day-rows" id="rows-'+iso+'"></div>';

  container.appendChild(block);

  // Render saved rows
  if (!rowCounts[iso]) rowCounts[iso] = 0;
  (dayData[iso] || []).forEach(function(r){ appendRow(iso, r); });
}

function addRow(iso, data){
  if (!rowCounts[iso]) rowCounts[iso] = 0;
  appendRow(iso, data || {von:'',bis:'',desc:'',gewerk:'',maschinen:''});
  scheduleAutoSave();
}

function appendRow(iso, data){
  rowCounts[iso] = (rowCounts[iso]||0) + 1;
  const rid = iso + '_' + rowCounts[iso];
  const selected = data.gewerk ? data.gewerk.split(',').map(function(s){return s.trim();}).filter(Boolean) : [];

  const container = document.getElementById('rows-'+iso);
  if (!container) return;

  const row = document.createElement('div');
  row.className = 'bz-row';
  row.id = 'brow-'+rid;
  row.innerHTML =
    '<div class="bz-cell"><input type="time" value="'+(data.von||'')+'" onchange="scheduleAutoSave()"></div>' +
    '<div class="bz-cell"><input type="time" value="'+(data.bis||'')+'" onchange="scheduleAutoSave()"></div>' +
    '<div class="bz-cell"><input type="text" placeholder="Beschreibung / Tätigkeit …" value="'+esc(data.desc||'')+'" oninput="scheduleAutoSave()"></div>' +
    '<div class="bz-cell gw-cell" id="gwcell-'+rid+'">' +
      '<div class="gw-chips" data-rid="'+rid+'" onclick="toggleGwPanel(this.dataset.rid,event)" id="gwchips-'+rid+'"></div>' +
      '<div class="gw-panel" id="gwpanel-'+rid+'"></div>' +
    '</div>' +
    '<div class="bz-cell"><input type="text" placeholder="z.B. Gabelstapler, Kran …" value="'+esc(data.maschinen||'')+'" oninput="scheduleAutoSave()"></div>' +
    '<div class="bz-cell"><button class="del-btn" data-rid="'+rid+'" onclick="delRow(this.dataset.rid)">×</button></div>';

  container.appendChild(row);
  buildGwPanel(rid, selected);
}

function buildGwPanel(rid, selected){
  const panel = document.getElementById('gwpanel-'+rid);
  if (!panel) return;
  panel.innerHTML = GEWERKE_LIST.map(function(g){
    const isSel = selected.indexOf(g.id) >= 0;
    return '<div class="gw-option'+(isSel?' selected':'')+'" id="gwopt-'+rid+'-'+g.id+'"'+
      (isSel?' style="background:'+g.color+'"':'')+
      ' data-rid="'+rid+'" data-gw="'+g.id+'" onclick="toggleGwOption(this.dataset.rid,this.dataset.gw,event)">'+
      '<div class="gw-dot" style="background:'+g.color+'"></div>'+g.label+'</div>';
  }).join('');
  renderGwChips(rid, selected);
}

function toggleGwOption(rid, gwId, evt){
  if (evt) evt.stopPropagation();
  const optEl = document.getElementById('gwopt-'+rid+'-'+gwId);
  if (!optEl) return;
  const g = GEWERKE_LIST.find(function(x){return x.id===gwId;});
  const isSel = optEl.classList.contains('selected');
  if (isSel) {
    optEl.classList.remove('selected');
    optEl.style.background = '';
  } else {
    optEl.classList.add('selected');
    optEl.style.background = g.color;
  }
  const sel = [];
  GEWERKE_LIST.forEach(function(gw){
    const el = document.getElementById('gwopt-'+rid+'-'+gw.id);
    if (el && el.classList.contains('selected')) sel.push(gw.id);
  });
  renderGwChips(rid, sel);
  scheduleAutoSave();
}

function renderGwChips(rid, selected){
  const chipsEl = document.getElementById('gwchips-'+rid);
  if (!chipsEl) return;
  if (!selected.length) {
    chipsEl.innerHTML = '<span class="gw-placeholder">Gewerk wählen …</span>';
    return;
  }
  chipsEl.innerHTML = selected.map(function(id){
    const g = GEWERKE_LIST.find(function(x){return x.id===id;});
    if (!g) return '';
    return '<span class="gw-chip" style="background:'+g.color+'">'+g.label+'</span>';
  }).join('');
}

function toggleGwPanel(rid, evt){
  if (evt) evt.stopPropagation();
  const panel  = document.getElementById('gwpanel-'+rid);
  const chips  = document.getElementById('gwchips-'+rid);
  if (!panel || !chips) return;
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.gw-panel.open').forEach(function(p){p.classList.remove('open');});
  if (!isOpen) {
    const rect = chips.getBoundingClientRect();
    // Position below chips, align left, but keep within viewport
    let left = rect.left;
    let top  = rect.bottom + 4;
    const panelW = 320;
    if (left + panelW > window.innerWidth - 8) left = window.innerWidth - panelW - 8;
    if (left < 4) left = 4;
    panel.style.top  = top  + 'px';
    panel.style.left = left + 'px';
    panel.style.width = panelW + 'px';
    panel.classList.add('open');
  }
}

document.addEventListener('click', function(e){
  if (!e.target.closest('.gw-cell')) {
    document.querySelectorAll('.gw-panel.open').forEach(function(p){p.classList.remove('open');});
  }
});

function delRow(rid){
  const el = document.getElementById('brow-'+rid);
  if (el) el.remove();
  scheduleAutoSave();
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Collect all row data ──
function collectData(){
  const result = {};
  document.querySelectorAll('.day-block').forEach(function(block){
    const iso = block.id.replace('day-','');
    const rows = [];
    block.querySelectorAll('.bz-row').forEach(function(row){
      const inputs = row.querySelectorAll('input[type="time"], input[type="text"]');
      const gwCell = row.querySelector('.gw-cell');
      const selGw = [];
      if (gwCell) {
        gwCell.querySelectorAll('.gw-option.selected').forEach(function(el){
          const gwId = el.id.split('-').pop();
          if (gwId) selGw.push(gwId);
        });
      }
      rows.push({
        von:      inputs[0]?.value || '',
        bis:      inputs[1]?.value || '',
        desc:     inputs[2]?.value || '',
        gewerk:   selGw.join(','),
        maschinen:inputs[3]?.value || ''
      });
    });
    result[iso] = rows;
  });
  return result;
}

// ── Save / Load ──
function getSaveKey(){ return 'nw_bauzeit_save_' + (eventName||'_default'); }

function saveState(manual){
  const state = { eventName, phases, dayData: collectData(), extraDays, savedAt: new Date().toISOString() };
  SupaDB.set(getSaveKey(), state);
  try { localStorage.setItem(getSaveKey(), JSON.stringify(state)); } catch(e) {}
  const ind = document.getElementById('saveInd');
  if (ind) {
    ind.textContent = '✓ Gespeichert ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    ind.style.color = '#2d7a4f';
    if (manual) setTimeout(()=>{ind.style.color='#aaa';}, 3000);
  }
}

let _saveTimer = null;
function scheduleAutoSave(){ clearTimeout(_saveTimer); _saveTimer = setTimeout(()=>saveState(false), 1500); }

// ── Init ──
async function init(){

  // ── Einmal-Migration localStorage → Supabase ──
  if (!localStorage.getItem('nw_bauzeit_migrated')) {
    const uploads = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('nw_bauzeit_save_')) {
        try { uploads.push(SupaDB.set(k, JSON.parse(localStorage.getItem(k)))); } catch(e) {}
      }
    }
    if (uploads.length) await Promise.all(uploads);
    localStorage.setItem('nw_bauzeit_migrated', '1');
  }

  let importData = null;

  // 1. URL-Parameter haben höchste Priorität (Sharing-Link)
  const _urlP = new URLSearchParams(window.location.search);
  const _urlE = _urlP.get('e');
  if (_urlE) {
    importData = {
      veranstaltung: _urlE,
      phases: {
        aufbau: _urlP.get('aufbau') || '',
        proben: _urlP.get('proben') || '',
        show:   _urlP.get('show')   || '',
        abbau:  _urlP.get('abbau')  || ''
      }
    };
  }

  // 2. localStorage als Fallback (öffnen aus Crewplanung ohne URL-Params)
  if (!importData) {
    try { const r=localStorage.getItem('nw_bauzeit_import'); if(r) importData=JSON.parse(r); } catch(e){}
  }

  if (importData) eventName = importData.veranstaltung || '';

  // Check for saved state
  let saved = null;
  // Supabase first, dann localStorage-Fallback
  await SupaDB.init([getSaveKey()]);
  saved = SupaDB.get(getSaveKey());
  if (!saved) { try { const r=localStorage.getItem(getSaveKey()); if(r) saved=JSON.parse(r); } catch(e){} }

  if (saved && saved.phases) {
    eventName = saved.eventName || eventName;
    // Immer aktuelle Phasen aus der Crewplanung verwenden (importData),
    // damit nachträglich hinzugefügte Phasen (z.B. Abbau) automatisch erscheinen
    phases    = (importData && importData.phases) ? importData.phases : saved.phases;
    dayData   = saved.dayData || {};
    extraDays = saved.extraDays || [];
    const ind = document.getElementById('saveInd');
    if (ind && saved.savedAt) {
      const t = new Date(saved.savedAt);
      ind.textContent = '✓ Stand: '+t.toLocaleDateString('de-DE')+' '+t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      ind.style.color = '#aaa';
    }
  } else if (importData) {
    phases  = importData.phases || {};
    dayData = {};
  } else {
    document.getElementById('planContainer').innerHTML =
      '<div style="color:#aaa;padding:20px;font-size:13px;">Keine Daten – bitte Bauzeitenplan aus der Crewplanung öffnen.</div>';
    return;
  }

  document.getElementById('eventLabel').textContent = eventName ? ' – '+eventName : '';
  renderAll();
}

// ── Excel Export ──
function exportExcel(){
  const wb = XLSX.utils.book_new();
  const days = getAllDays();
  const wsData = [['Datum','Phase','Von','Bis','Beschreibung / Tätigkeit','Gewerk','Arbeitsmaschinen']];
  days.forEach(function(iso){
    const ph = getPhaseForDay(iso).map(k=>k.charAt(0).toUpperCase()+k.slice(1)).join('+');
    const rows = collectData()[iso] || [];
    if (rows.length) {
      rows.forEach(function(r,i){
        const gwLabels = r.gewerk ? r.gewerk.split(',').map(function(id){
          const g=GEWERKE_LIST.find(x=>x.id===id.trim()); return g?g.label:id;
        }).join(', ') : '';
        wsData.push([i===0?fmtDate(iso):'', i===0?ph:'', r.von, r.bis, r.desc, gwLabels, r.maschinen]);
      });
    } else {
      wsData.push([fmtDate(iso), ph, '','','','','']);
    }
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [20,10,8,8,36,14,20].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, 'Bauzeitenplan');
  const safe = (eventName||'Bauzeitenplan').replace(/[^a-zA-Z0-9äöüÄÖÜß\-_ ]/g,'').trim();
  XLSX.writeFile(wb, safe+'_Bauzeitenplan.xlsx');
}

function buildPrintHTML(liveData, days){
  const PHASE_HEX = {aufbau:'#c0713a',proben:'#4a7fb5',show:'#5a9e6f',abbau:'#8a8a8a',extra:'#6a6a6a'};
  const PHASE_LBL = {aufbau:'Aufbau',proben:'Proben',show:'Show',abbau:'Abbau'};
  const GW = {};
  GEWERKE_LIST.forEach(function(g){ GW[g.id]=g; });

  const today = new Date();
  const dateStr = today.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});

  // Phase legend
  var legendHtml = ['aufbau','proben','show','abbau'].map(function(k){
    return '<div class="li"><div class="ld" style="background:'+PHASE_HEX[k]+'"></div>'+PHASE_LBL[k]+'</div>';
  }).join('');

  // Day blocks
  var daysHtml = '';
  days.forEach(function(iso){
    var pfd = getPhaseForDay(iso);
    var isExtra = pfd.length===0;
    var ph0 = pfd[0]||'extra';
    var phLabel = isExtra ? 'Zusatztag' : pfd.map(function(k){return PHASE_LBL[k]||k;}).join(' + ');

    // Header gradient or solid
    var hBg;
    if(pfd.length>1){
      var pct=100/pfd.length;
      var stops=pfd.map(function(k,i){
        var c=PHASE_HEX[k]||'#888';
        return c+' '+(i*pct)+'%,'+c+' '+((i+1)*pct)+'%';
      }).join(',');
      hBg='linear-gradient(90deg,'+stops+')';
    } else { hBg=PHASE_HEX[ph0]||'#888'; }

    // Rows
    var rows = liveData[iso]||[];
    var rowsHtml='';
    if(!rows.length){
      rowsHtml='<tr><td colspan="5" style="padding:5px 8px;font-size:9px;color:#bbb;font-style:italic;">–</td></tr>';
    } else {
      rows.forEach(function(r){
        if(!r.von&&!r.bis&&!r.desc&&!r.gewerk&&!r.maschinen) return;
        var gwHtml='';
        if(r.gewerk){
          r.gewerk.split(',').filter(Boolean).forEach(function(id){
            var g=GW[id.trim()];
            if(g) gwHtml+='<span style="display:inline-block;background:'+g.color+';color:#fff;padding:1px 5px;border-radius:2px;font-size:7.5px;font-weight:700;margin:1px 1px 1px 0;letter-spacing:.3px;">'+pEsc(g.label)+'</span>';
          });
        }
        rowsHtml+='<tr>'
          +'<td class="tc">'+pEsc(r.von||'')+'</td>'
          +'<td class="tc">'+pEsc(r.bis||'')+'</td>'
          +'<td>'+pEsc(r.desc||'')+'</td>'
          +'<td>'+gwHtml+'</td>'
          +'<td>'+pEsc(r.maschinen||'')+'</td>'
          +'</tr>';
      });
      if(!rowsHtml) rowsHtml='<tr><td colspan="5" style="padding:5px 8px;font-size:9px;color:#bbb;font-style:italic;">–</td></tr>';
    }

    daysHtml+=
      '<div class="db">'
        +'<div class="dh" style="background:'+hBg+'">'
          +'<span class="dn">'+fmtDate(iso)+'</span>'
          +'<span class="dbg">'+phLabel+'</span>'
        +'</div>'
        +'<table class="bt">'
          +'<thead><tr>'
            +'<th style="width:46px">Von</th>'
            +'<th style="width:46px">Bis</th>'
            +'<th>Beschreibung / Tätigkeit</th>'
            +'<th style="width:130px">Gewerk</th>'
            +'<th style="width:120px">Arbeitsmaschinen</th>'
          +'</tr></thead>'
          +'<tbody>'+rowsHtml+'</tbody>'
        +'</table>'
      +'</div>';
  });

  return '<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">'
    +'<title>Bauzeitenplan – '+pEsc(eventName)+'</title>'
    +'<style>'
    +'@page{size:A4 portrait;margin:12mm 12mm 14mm 12mm;}'
    +'*{box-sizing:border-box;margin:0;padding:0;}'
    +'body{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:#1a1a1a;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'
    /* Repeating header/footer via HTML table thead/tfoot trick */
    +'table.pt{width:100%;border-collapse:collapse;}'
    +'table.pt>thead>tr>td{padding-bottom:0;}'
    +'table.pt>tfoot>tr>td{padding-top:0;}'
    /* Doc header */
    +'.dh-wrap{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:8px;border-bottom:2.5px solid #1a1a1a;margin-bottom:10px;}'
    +'.logo{font-size:15px;font-weight:900;letter-spacing:4px;text-transform:uppercase;}'
    +'.logo em{font-style:normal;font-weight:200;}'
    +'.ev{text-align:center;}'
    +'.ev-name{font-size:13px;font-weight:700;letter-spacing:.5px;}'
    +'.ev-type{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:#999;margin-top:3px;}'
    +'.meta{text-align:right;font-size:8px;color:#999;line-height:1.6;}'
    /* Legend */
    +'.leg{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;}'
    +'.li{display:flex;align-items:center;gap:4px;font-size:8px;color:#555;letter-spacing:1px;text-transform:uppercase;}'
    +'.ld{width:9px;height:9px;border-radius:1px;flex-shrink:0;}'
    /* Day blocks */
    +'.db{break-inside:avoid;margin-bottom:7px;border:1px solid #ddd;border-radius:3px;overflow:hidden;}'
    +'.dh{display:flex;align-items:center;gap:8px;padding:6px 10px;color:#fff;}'
    +'.dn{flex:1;font-size:11px;font-weight:700;}'
    +'.dbg{background:rgba(255,255,255,.22);border-radius:2px;padding:2px 6px;font-size:7.5px;letter-spacing:1px;text-transform:uppercase;}'
    /* Table */
    +'.bt{width:100%;border-collapse:collapse;}'
    +'.bt thead tr{background:#f7f6f4;}'
    +'.bt th{padding:4px 7px;font-size:7.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#aaa;border-bottom:1px solid #eee;border-right:1px solid #eee;text-align:left;}'
    +'.bt th:last-child{border-right:none;}'
    +'.bt td{padding:5px 7px;font-size:9.5px;border-bottom:1px solid #f0eeed;border-right:1px solid #f0eeed;vertical-align:top;line-height:1.45;}'
    +'.bt td:last-child{border-right:none;}'
    +'.bt tr:last-child td{border-bottom:none;}'
    +'.tc{white-space:nowrap;color:#666;}'
    /* Footer */
    +'.foot{display:flex;justify-content:space-between;font-size:7.5px;color:#bbb;border-top:1px solid #eee;padding-top:5px;margin-top:4px;}'
    +'</style></head><body>'
    +'<table class="pt">'
      +'<thead><tr><td>'
        +'<div class="dh-wrap">'
          +'<img src="'+NOVA_LOGO+'" style="height:32px;display:block" alt="NOVA WORKS" />'
          +'<div class="ev"><div class="ev-name">'+pEsc(eventName)+'</div><div class="ev-type">Bauzeitenplan</div></div>'
          +'<div class="meta">Erstellt: '+pEsc(dateStr)+'</div>'
        +'</div>'
        +'<div class="leg">'+legendHtml+'</div>'
      +'</td></tr></thead>'
      +'<tfoot><tr><td>'
        +'<div class="foot">'
          +'<span>NOVA WORKS</span>'
          +'<span>'+pEsc(eventName)+' &nbsp;·&nbsp; Bauzeitenplan &nbsp;·&nbsp; '+pEsc(dateStr)+'</span>'
        +'</div>'
      +'</td></tr></tfoot>'
      +'<tbody><tr><td style="padding-top:2px">'+daysHtml+'</td></tr></tbody>'
    +'</table>'
    +'</body></html>';
}

function exportPDF(){
  var liveData = collectData();
  var days = getAllDays();
  if(!days.length){ alert('Keine Daten vorhanden.'); return; }

  var safe = (eventName||'Bauzeitenplan').replace(/[^a-zA-Z0-9äöüÄÖÜß\-_ ]/g,'').trim();
  var today = new Date();
  var ds = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var fname = safe + '_Bauzeitenplan_' + ds + '.pdf';

  var content = buildPrintHTML(liveData, days);

  // Toolbar + own html2canvas/jsPDF scripts embedded in the print window
  var toolbar =
    '<style>'
    +'#_tb{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;padding:10px 20px;display:flex;align-items:center;gap:12px;z-index:9999;box-shadow:0 -2px 12px rgba(0,0,0,.4)}'
    +'#_tb button{border:none;border-radius:3px;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.4px}'
    +'</style>'
    +'<div id="_tb">'
      +'<span id="_st" style="color:#aaa;font-size:11px;flex:1">Vorschau bereit</span>'
      +'<button onclick="doPDF()" style="background:#c8a96e;color:#1a1a1a">&#x1F4E5; PDF herunterladen</button>'
      +'<button onclick="window.close()" style="background:#333;color:#ccc">&#x2715; Schließen</button>'
    +'</div>'
    +'<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>'
    +'<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>'
    +'<script>'
    +'var _fn='+JSON.stringify('FNAME_PLACEHOLDER')+';'
    +'function doPDF(){'
      +'var bar=document.getElementById("_tb");'
      +'var st=document.getElementById("_st");'
      +'st.textContent="⏳ PDF wird erstellt – bitte warten…";'
      +'bar.querySelectorAll("button").forEach(function(b){b.disabled=true;});'
      // Logo aus html2canvas herausnehmen, danach per jsPDF direkt einfügen
      +'var logoEl=document.querySelector("img[alt=\'NOVA WORKS\']");'
      +'var logoSrc=logoEl?logoEl.src:null;'
      +'var logoW=logoEl?logoEl.offsetWidth:0;'
      +'var logoH=logoEl?logoEl.offsetHeight:0;'
      +'if(logoEl)logoEl.style.visibility="hidden";'
      +'var body=document.body;'
      +'var h=Math.max(document.documentElement.scrollHeight,body.scrollHeight);'
      +'html2canvas(body,{'
        +'scale:2,useCORS:true,allowTaint:true,backgroundColor:"#fff",'
        +'ignoreElements:function(el){return el.id==="_tb";},'
        +'windowWidth:794,windowHeight:h,width:794,height:h,'
        +'scrollX:0,scrollY:0'
      +'}).then(function(canvas){'
        +'if(logoEl)logoEl.style.visibility="";'
        +'var jP=window.jspdf.jsPDF;'
        +'var pdf=new jP({orientation:"portrait",unit:"mm",format:"a4"});'
        +'var pW=210,pH=297,iH=(canvas.height/canvas.width)*pW;'
        +'var pageImg=canvas.toDataURL("image/jpeg",0.93);'
        // px→mm: 794px = 210mm
        +'var px2mm=210/794;'
        +'var lW=logoW*px2mm,lH=logoH*px2mm;'
        +'var y=0;'
        +'while(y<iH){'
          +'if(y>0)pdf.addPage();'
          +'pdf.addImage(pageImg,"JPEG",0,-y,pW,iH);'
          // Logo direkt per jsPDF auf jede Seite zeichnen
          +'if(logoSrc&&lW>0&&lH>0)pdf.addImage(logoSrc,"PNG",2,2,lW,lH);'
          +'y+=pH;'
        +'}'
        +'pdf.save(_fn);'
        +'st.textContent="✓ PDF gespeichert";'
        +'bar.querySelectorAll("button").forEach(function(b){b.disabled=false;});'
      +'}).catch(function(e){'
        +'if(logoEl)logoEl.style.visibility="";'
        +'st.textContent="Fehler: "+e.message;'
        +'bar.querySelectorAll("button").forEach(function(b){b.disabled=false;});'
      +'});'
    +'}'
    +'<\/script>';

  // Replace FNAME_PLACEHOLDER with real filename (safely escaped)
  toolbar = toolbar.replace('"FNAME_PLACEHOLDER"', JSON.stringify(fname));

  // Add toolbar before </body>
  var fullHtml = content.replace('</body>', toolbar + '</body>');

  var win = window.open('', '_blank', 'width=860,height=720,scrollbars=yes,resizable=yes');
  if(!win){ alert('Bitte den Popup-Blocker für diese Seite deaktivieren.'); return; }
  win.document.write(fullHtml);
  win.document.close();
}

init();
</script>
</body>
</html>
