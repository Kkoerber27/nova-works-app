<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funkgeräte Ausgabeliste</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--dark:#1a1a1a;--accent:#c8a96e;--border:#ddd;--bg:#f4f3f1;--ink:#1a1a1a;--ink2:#555}
  html,body{font-family:"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  .topbar img{height:34px}
  .topbar-title{font-size:14px;font-weight:300;letter-spacing:2px;text-transform:uppercase;flex:1}
  .topbar-title small{font-size:11px;color:#999;margin-left:6px;letter-spacing:.5px;text-transform:none}
  .btn{padding:8px 16px;border:none;border-radius:3px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.4px}
  .btn-pdf{background:var(--accent);color:#1a1a1a}
  .btn-pdf:hover{opacity:.88}
  .btn-back{background:none;border:1px solid #ccc;color:var(--ink2)}
  .main{padding:24px 28px;max-width:1180px;margin:0 auto}
  .sheet-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--dark);padding-bottom:10px;margin-bottom:18px}
  .sheet-head h1{font-size:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .sheet-head .meta{text-align:right;font-size:11px;color:var(--ink2);line-height:1.5}
  .sheet-head .meta b{color:var(--ink)}
  .grp{margin-bottom:14px;border-radius:5px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);background:#fff;break-inside:avoid}
  .grp-h{color:#fff;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:7px 14px}
  .grp-h .cnt{background:rgba(255,255,255,.25);border-radius:3px;padding:1px 8px;font-size:11px;margin-left:6px}
  table.tbl{width:100%;border-collapse:collapse}
  .tbl th{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#888;background:#f7f6f4;padding:6px 6px;border-bottom:1px solid var(--border);border-right:1px solid #eee;text-align:center;vertical-align:middle}
  .tbl th span{font-weight:400;text-transform:none;font-size:8.5px;color:#aaa}
  .tbl th.nm{text-align:left;width:20%}
  .tbl th.chk{width:7.5%}
  .tbl th.wr{width:14%}
  .tbl td{border-bottom:1px solid #f0eeed;border-right:1px solid #f3f1ef;padding:0}
  .tbl tr:last-child td{border-bottom:none}
  td.nm{padding:7px 10px;font-size:12.5px;font-weight:500}
  td.nm small{color:#aaa;font-weight:400;font-size:10px}
  td.chk{text-align:center;height:30px}
  td.chk input.cb{width:16px;height:16px;cursor:pointer;accent-color:#2a8a8f;margin:0;vertical-align:middle}
  td.wr input.wr-in{width:100%;height:30px;border:none;background:transparent;font-size:12px;font-family:inherit;color:var(--ink);padding:4px 8px;outline:none}
  td.wr input.wr-in:focus{background:#eef7f7}
  @media print{ td.chk input.cb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border:1.5px solid #999;border-radius:3px;position:relative} td.chk input.cb:checked::after{content:"\2713";position:absolute;top:-2px;left:1px;font-size:14px;color:#1a1a1a;font-weight:700} }
  td.wr{height:30px}
  .foot{margin-top:18px;font-size:10px;color:#999;display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px}
  .empty{padding:60px 20px;text-align:center;color:#999;font-size:14px}
  .print-logo{display:none}
  @media print{
    .no-print{display:none!important}
    .topbar{position:static;box-shadow:none}
    html,body,.main{background:#fff!important}
    .main{max-width:none;padding:0}
    .grp{box-shadow:none;border:1px solid #ddd}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .print-logo{display:block!important}
    @page{size:A4 portrait;margin:12mm 10mm}
  }
</style>
</head>

var CHECK_COLS = ["Funkgerät","Rasierer","Tarnset","extra Akku","Tasche/Klipp"];
// Reihenfolge & Farben der Gewerke (wie in der Crewplanung)
var GROUP_ORDER = ["Technische Leitung","Licht","Ton","Rigging","AV / Video","Logistik"];
var GROUP_COLOR = {
  "Technische Leitung":"#8a8a8a","Licht":"#4a7fb5","Ton":"#5a9e6f",
  "Rigging":"#c0713a","AV / Video":"#7c5cbf","Logistik":"#b5862a"
};

function esc(x){return (x==null?"":String(x)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function getParam(n){return new URLSearchParams(location.search).get(n)||"";}

function loadData(){
  try{
    var raw = localStorage.getItem('nw_funk_import');
    if(raw){ var d=JSON.parse(raw); if(d && d.personnel) return d; }
  }catch(e){}
  return null;
}

function render(){
  var d = loadData();
  var root = document.getElementById('root');
  var eParam = getParam('e');
  if(!d){
    document.getElementById('tbSub').textContent = eParam ? " · "+eParam : "";
    root.innerHTML = '<div class="empty">Keine Crew-Daten gefunden.<br>'+
      'Bitte die Funkgeräte-Liste in der <b>Crewplanung</b> über den Button „Funkgeräte" erzeugen.</div>';
    return;
  }
  var event = d.event || eParam || "Veranstaltung";
  document.getElementById('tbSub').textContent = " · "+event;
  document.title = "Funkgeräte – "+event;

  // group personnel
  var groups = {};
  d.personnel.forEach(function(p){
    var g = p.gruppe || "Sonstige";
    (groups[g]=groups[g]||[]).push(p);
  });
  var order = GROUP_ORDER.filter(function(g){return groups[g];});
  Object.keys(groups).forEach(function(g){ if(order.indexOf(g)<0) order.push(g); });

  var total = d.personnel.length;
  var html = ''+
    '<div class="sheet-head">'+
      '<div>'+
        '<img src="'+LOGO+'" class="print-logo" alt="Nova Works" style="height:30px;margin-bottom:8px">'+
        '<h1>Funkgeräte – Ausgabeliste</h1>'+
      '</div>'+
      '<div class="meta">'+
        '<div><b>'+esc(event)+'</b></div>'+
        (d.location?'<div>'+esc(d.location)+'</div>':'')+
        (d.zeitraum?'<div>Zeitraum: '+esc(d.zeitraum)+'</div>':'')+
        '<div>Crew gesamt: <b>'+total+'</b></div>'+
      '</div>'+
    '</div>';

  order.forEach(function(g){
    var members = groups[g];
    var c = GROUP_COLOR[g] || "#1a1a1a";
    html += '<div class="grp">'+
      '<div class="grp-h" style="background:'+c+'">'+esc(g)+' <span class="cnt">'+members.length+'</span></div>'+
      '<table class="tbl"><thead><tr>'+
        '<th class="nm">Name</th>'+
        CHECK_COLS.map(function(col){return '<th class="chk">'+esc(col)+'</th>';}).join('')+
        '<th class="wr">Ausgabe<br><span>Tag / Uhrzeit</span></th>'+
        '<th class="wr">Zurück<br><span>Datum / Uhrzeit</span></th>'+
      '</tr></thead><tbody>';
    members.forEach(function(m){
      var fn = (m.funktion && m.funktion!==g) ? ' <small>· '+esc(m.funktion)+'</small>' : '';
      html += '<tr><td class="nm">'+esc(m.name)+fn+'</td>'+
        CHECK_COLS.map(function(){return '<td class="chk"><input type="checkbox" class="cb"></td>';}).join('')+
        '<td class="wr"><input type="text" class="wr-in"></td><td class="wr"><input type="text" class="wr-in"></td></tr>';
    });
    html += '</tbody></table></div>';
  });

  html += '<div class="foot">'+
    '<span>NOVA WORKS · Funkgeräte-Ausgabe &amp; Rückgabe</span>'+
    '<span>Unterschrift Ausgabe: ____________________   ·   Unterschrift Rückgabe: ____________________</span>'+
  '</div>';
  root.innerHTML = html;
}
render();
</script>
